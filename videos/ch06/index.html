<body>
<script src="../lib/engine.js?v=d6885892"></script>
<script src="../lib/mm4.js?v=1928c069"></script>

<script>
'use strict';
/* Mr. O's 4th grade · Math Module 4, Lesson 4.3 (4.NBT.5): round, then multiply. Drawn like HIS board notes, page 3
   ("Estimate a product: 4 × 387 · 1 Round: 387 → 400 · 2 Fact: 4 × 4 = 16 · 3 Zeros back: 4 × 400 = 1,600"), and his
   classwork Part 1 ("Round the big number to its biggest place."): a class earns $168 a week; about how much in 7
   weeks? 1 Round: 168 → 200 · 2 Fact: 7 × 2 = 14 · 3 Zeros back: 7 × 200 = 1,400, so about $1,400. The one-digit
   number is written first, as he does (7 × 200). The trap, in her words: round to the closest hundred (132 → 100, not
   200). Nothing he did not use (no halfway mark, no number line). Every number appears on the word that says it
   (offsets from the marks, read off narration.en.timings.json). */
const CHAPTER = { number: 6, title: 'Round, then multiply', minutes: 1, language: 'en' };

const WHITE = '#ffffff', EDGE = '#d3dde0';
// a piece that waits for its word: hidden, then faded in at t
const later = (e, t, dur = .35) => { put(e, { o: 0 }); show(e, t, dur); return e; };
// a number or word that pops in on its word
const popText = (p, str, x, y, t0, opts = {}) => {
  const e = T(p, str, { x, y, size: 40, fill: INK, anchor: 'middle', weight: 700, ...opts, o: 0 });
  put(e, { s: .4 });
  tw(e, { o: 1, s: 1 }, t0, .45, back);
  return e;
};
// a line in ink whose pieces come in on their words (times[k] for piece k). A dRight card with the same pieces lands
// on top of it later, so the claim is on screen as she says it and turns orange when she judges it.
const sayLine = (p, items, x, y, times, size) => {
  const ln = dLine(p, items, x, y, times[0], { size });
  ln.row.forEach((e, k) => { if (k) later(e, times[k]); });
  return ln;
};
// HIS BOARD: the white panel with a thin gray edge that his notes are written on
const boardCard = (p, x, y, w, h, t0) => {
  const r = mk('rect', { x, y, width: w, height: h, rx: 26, fill: WHITE, stroke: EDGE, 'stroke-width': 3 }, p);
  put(r, { o: 0 }); show(r, t0, .5);
  return r;
};

/* HIS NUMBERED STEPS (board notes p3): a numbered circle, then the step written in a row. The circle comes on
   "Step one", the row's pieces on their words. Returns the dLine (row). */
const STEP_X = 300, STEP_SIZE = 60;
const stepNum = (p, n, y, t0) => {
  const g = G(p, { x: STEP_X, y: y - STEP_SIZE * .32, o: 0, s: .5 });
  mk('circle', { cx: 0, cy: 0, r: 32, fill: BLUE }, g);
  T(g, String(n), { x: 0, y: 13, size: 38, fill: WHITE, weight: 800, anchor: 'middle' });
  tw(g, { o: 1, s: 1 }, t0, .45, back);
  return g;
};
const stepRow = (p, items, y, times) => {
  const ln = dLine(p, items, STEP_X + 58, y, times[0], { size: STEP_SIZE, anchor: 'start' });
  ln.row.forEach((e, k) => { if (k) later(e, times[k]); });
  return ln;
};
// the fact, underlined in teal: under pieces i..j of a row, drawn on at t0
const underline = (ln, i, j, t0, color = TEAL) => {
  const row = ln.row, a = row[i]._px - row[i]._w / 2, b = row[j]._px + row[j]._w / 2, y = row.y + row.size * .2;
  const e = path(ln, `M${a} ${y}H${b}`, { stroke: color, 'stroke-width': 6, fill: 'none' }, { d: 0 });
  draw(e, t0, .45);
  return e;
};

/* A CALENDAR PAGE (one week), drawn big around its own centre; the row of seven weeks shows it at PS.
   Its body text sits at (0, BODY_Y); text sizes are chosen so they stay 32 px or more at PS. */
const PW = 340, PH = 330, PBAND = 84, BODY_Y = 76, PS = .57;
const ROW_X = [-3, -2, -1, 0, 1, 2, 3].map(k => 800 + k * 206), ROW_Y = 450;
const calPage = (p, x, y, s, t0) => {
  const g = G(p, { x, y, s, o: 0 });
  const top = -PH / 2, r = 22;
  mk('rect', { x: -PW / 2, y: top, width: PW, height: PH, rx: r, fill: WHITE }, g);
  path(g, `M${-PW / 2} ${top + PBAND}V${top + r}Q${-PW / 2} ${top} ${-PW / 2 + r} ${top}H${PW / 2 - r}Q${PW / 2} ${top} ${PW / 2} ${top + r}V${top + PBAND}Z`,
    { fill: GROUP[0], stroke: 'none' });
  mk('rect', { x: -PW / 2, y: top, width: PW, height: PH, rx: r, fill: 'none', stroke: '#9aa6ae', 'stroke-width': 4 }, g);
  [-90, 90].forEach(rx => mk('rect', { x: rx - 9, y: top - 20, width: 18, height: 40, rx: 9, fill: '#55646a' }, g));   // the rings
  show(g, t0, .45);
  return g;
};
const pageHead = (g, str, t0) => {
  const e = T(g, str, { x: 0, y: -PH / 2 + 64, size: 58, fill: WHITE, anchor: 'middle', weight: 800, o: 0 });   // 33 px at PS
  show(e, t0, .35);
  return e;
};

const BEATS = [
  ['intro', 'Round, then multiply', titleBeat('Lesson 4.3', 'Round, then multiply', 'Round. Do the fact. Put the zeros back.')],

  ['story', 'Each week', (m) => {
    const p = panel(0);
    // "A class earns one hundred sixty-eight dollars each week."
    const given = dLine(p, ['$168', ' each week'], 800, 150, m('q', -3.09), { size: 66, card: BLUE_BG });   // "one hundred sixty-eight dollars"
    later(given.row[1], m('q', -1.14));                                                      // "each week"
    const first = calPage(p, 800, ROW_Y, 1, .3);                                             // "A class earns": one week's page
    popText(first, '$168', 0, BODY_Y, m('q', -3.09), { size: 96, weight: 800 });
    pageHead(first, 'week 1', m('q', -1.14));
    // "About how much will it earn in seven weeks?": the page joins a row of seven weeks
    tw(first, { x: ROW_X[0], s: PS }, m('q'), .8, io);
    ROW_X.slice(1).forEach((x, k) => {
      const t = m('q', 1.55 + k * .1);                                                       // "seven weeks"
      const pg = calPage(p, x, ROW_Y, PS, t);
      pageHead(pg, `week ${k + 2}`, t);
      dText(pg, '$168', 0, BODY_Y, t, { size: 96, fill: INK, weight: 800 });
    });
    const q = dLine(p, ['About how much in ', '7 weeks?'], 800, 720, m('q'), { size: 56 });
    later(q.row[1], m('q', 1.55));
  }],

  ['steps', 'Round, fact, zeros back', (m) => {
    const p = panel(0);
    dLine(p, ['7 × 168'], 800, 140, .3, { size: 84, card: BLUE_BG });
    boardCard(p, 200, 210, 1200, 445, .3);
    // "Step one. Round the big number to its biggest place. One hundred sixty-eight rounds to two hundred."
    stepNum(p, 1, 300, m('s1'));
    const r1 = stepRow(p, ['Round: ', '168', ' → ', '200'], 300, [m('s1', 1.37), m('s1', 4.28), m('s1', 5.69), m('s1', 6.17)]);
    dText(p, 'Round the big number to its biggest place.', r1.row[0]._px - r1.row[0]._w / 2, 365, m('s1', 1.70),
      { size: 36, fill: COL.dim, anchor: 'start', weight: 600 });                            // his classwork's words
    // "Step two. Do the fact. Seven times two is fourteen."
    stepNum(p, 2, 465, m('s2'));
    const r2 = stepRow(p, ['Fact: ', ...['7', ' × ', '2', ' = ', '14'].map(t => ({ t, fill: TEAL }))], 465,
      [m('s2', 1.31), m('s2', 2.64), m('s2', 3.12), m('s2', 3.62), m('s2', 3.85), m('s2', 4.09)]);
    underline(r2, 1, 5, m('s2', 4.45));
    // "Step three. Put the zeros back. Seven times two hundred is one thousand, four hundred."
    stepNum(p, 3, 590, m('s3'));
    S.r3 = stepRow(p, ['Zeros back: ', { t: '7', fill: TEAL }, ' × ', { t: '2', fill: TEAL }, { t: '00', fill: ORANGE }, ' = ',
      { t: '1,4', fill: TEAL }, { t: '00', fill: ORANGE }], 590,
      [m('s3', 1.51), m('s3', 3.28), m('s3', 3.79), m('s3', 4.22), m('s3', 4.22), m('s3', 4.99), m('s3', 5.17), m('s3', 5.17)]);
  }],

  ['answer', 'About $1,400', (m) => {
    const p = S.panel;
    // "The class will earn about one thousand, four hundred dollars."
    const ans = dLine(p, ['about ', '$1,400'], 800, 775, m('a', 1.15), { size: 80, card: ORANGE_BG });   // "about"
    later(ans.row[1], m('a', 1.45));                                                         // "one thousand, four hundred dollars"
    [6, 7].forEach(k => dNudge(S.r3.row[k], m('a', 1.45)));
  }],

  ['mistake', 'Watch out', (m) => {
    const p = panel(0);
    dWatchOut(p, .3, 800, 100);
    dText(p, 'Round to the closest hundred.', 800, 240, m('w'), { size: 50, fill: INK, weight: 700 });   // her words
    // "One hundred thirty-two rounds to one hundred, …"
    const ok = [['132', ' → ', '100'], 470, 500];
    sayLine(p, ...ok, [m('n'), m('n', 1.49), m('n', 2.03)], 76);
    dRight(p, ...ok, m('n', 2.03), { size: 76 });
    // "… not two hundred." — only the 200 is struck
    dMistake(p, ['132 →  ', { t: '200', fill: RED }], 1110, 500, m('n', 3.55), null, { size: 76, strike: [1, 1] });
  }, { minDur: 10.6 }],                                                                      // the finished mistake holds 2.5 s

  ['wrap', 'Remember', rememberBeat([['Round.', 'w1'], ['Do the fact.', 'w2'], ['Put the zeros back.', 'w3']])],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
