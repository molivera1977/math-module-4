<script>
'use strict';
/* Mr. O's 4th grade · Math Module 4, Lesson 4.1 (4.NBT.5): multiplication patterns. Mia sells 90 bookmarks for $9
   each; how much for 900 bookmarks?
   Redrawn 11/13 to show HIS lessons and nothing new (Mr. O: "emphasize what I taught … not introduce something new"):
   · ladder = his homework 11-10 Part 1 example "3 × 2 = 6 / 3 × 20 = 60 / 3 × 200 = 600 / 3 × 2,000 = 6,000 —
     Do the fact first. Each line gets one more zero.", here 9 × 9 = 81 / 9 × 90 = 810 / 9 × 900 = 8,100, the lines
     on one "=", the fact's digits underlined like his green underline, the added zeros orange (as on his sheet)
   · answer = "900 is 10 times 90, so the money is 10 times as much" (he taught ten times as much in class, 11/13)
   · mistake = $810 is the money for 90 bookmarks; 900 has one more zero, so the answer gets one more zero
   Colours: teal = the fact, orange = the zeros that come along, red = the mistake only, blue card = the problem. */
const CHAPTER = { number: 2, title: 'Ten times as much', minutes: 1, language: 'en' };

/* ── his board, as helpers ── */
// pieces ks of a line wait until t, the word that says them
const later = (line, ks, t) => ks.forEach(k => { put(line.row[k], { o: 0 }); show(line.row[k], t, .35); });
// a line whose answer (pieces k to the end) hides behind a "?" until reveal(line, t)
const ask = (p, items, k, x, y, t0, { qFill = INK, ...opts } = {}) => {
  const line = dLine(p, items, x, y, t0, opts), row = line.row;
  row.slice(k).forEach(e => put(e, { o: 0 }));
  line._q = M(line, ['?'], { x: row[k]._px - row[k]._w / 2 + textW('?', row.size) / 2, y: row.y, size: row.size, fill: qFill });
  line._k = k;
  return line;
};
const reveal = (line, t) => { hide(line._q, t, .2); line.row.slice(line._k).forEach(e => show(e, t + .1, .35)); };
const askRow = (p, items, k, x, y, t0, tAns, opts) => { const line = ask(p, items, k, x, y, t0, opts); reveal(line, tAns); return line; };
// the problem's blue card turns into an orange answer card
const answered = (line, t) => tw(line.firstChild, { c_fill: ORANGE_BG }, t, .5);
// piece k of a line flies in from (x, y) at t0: the fact's digits from the fact, the zeros from where they were covered
const flyPiece = (line, k, [x, y], t0, dur = .8) => {
  const e = line.row[k];
  put(e, { x, y, o: 0 });
  tw(e, { o: 1 }, t0, .15);
  tw(e, { x: e._px, y: line.row.y }, t0, dur, io);
};
const spot = (line, k) => [line.row[k]._px, line.row.y];
// the kit's sticky note over pieces i..j, set a little right so it does not hide the end of the fact's last digit
const coverZeros = (line, i, j, t0) => { const n = dCover(line, i, j, t0); put(n, { x: st(n).x + line.row.size * .06 }); return n; };
// his green underline under the fact's digits (teal here): under pieces i..j of a line, drawn on at t0
const uline = (line, i, j, t0, color = TEAL) => {
  const row = line.row, sz = row.size, a = row[i]._px - row[i]._w / 2 + sz * .04, b = row[j]._px + row[j]._w / 2 - sz * .04, y = row.y + sz * .17;
  draw(path(line, `M${a} ${y}H${b}`, { stroke: color, 'stroke-width': Math.max(5, sz * .075), fill: 'none' }, { d: 0 }), t0, .4);
};
// a ring drawn round piece k of a line
const ring = (line, k, t0, color = TEAL) => {
  const e = line.row[k], sz = line.row.size, cx = e._px, cy = line.row.y - sz * .36, rx = e._w / 2 + sz * .07, ry = sz * .5;
  draw(path(line, `M${cx} ${cy - ry}A${rx} ${ry} 0 1 0 ${cx + .1} ${cy - ry}`, { stroke: color, 'stroke-width': 6, fill: 'none' }, { d: 0 }), t0, .5);
};
// his numbered steps (homework 11-9 Part 5): a teal number, then the step's name in ink; the maths sits in one column after
const LX = 236;
const stepName = (p, n, str, y, t0, size = 44) => {
  const g = G(p, { o: 0 }), cy = y - size * .34;
  mk('circle', { cx: LX - 50, cy, r: 28, fill: TEAL }, g);
  T(g, String(n), { x: LX - 50, y: cy + 12, size: 34, fill: '#ffffff', weight: 800, anchor: 'middle' });
  T(g, str, { x: LX, y, size, fill: INK, weight: 600 });
  show(g, t0, .4);
  return g;
};
const mathCol = (names, size = 44) => LX + Math.max(...names.map(s => uiW(s, size))) + 46;
// the centre x that starts piece k of a line at x (to line rows up)
const centreAt = (items, size, k, x) => {
  const w = items.map(it => textW(typeof it === 'string' ? it : it.t, size));
  return x - w.slice(0, k).reduce((a, b) => a + b, 0) + w.reduce((a, b) => a + b, 0) / 2;
};
// a line set on an "=" at x = eq: the left side ends before it, the right side (behind a "?" until tR) starts after it
const eqLine = (p, left, right, eq, y, tL, tR, { size = 72, q = true } = {}) => {
  const gap = size * .6;
  const L = dLine(p, left, eq - gap, y, tL, { size, anchor: 'end' });
  dLine(p, ['='], eq, y, tL, { size });
  const R = q ? askRow(p, right, 0, eq + gap, y, tL, tR, { size, anchor: 'start' }) : dLine(p, right, eq + gap, y, tL, { size, anchor: 'start' });
  return { L, R };
};
// the kit's right answer (orange card and ✓) whose answer, pieces k.., waits behind a "?" until tAns, the word that says it
const rightAsk = (p, items, k, x, y, t0, tAns, { size = 64, anchor = 'middle', q = true } = {}) => {
  const line = askRow(p, items, k, x, y, t0, tAns, { size, anchor, card: ORANGE_BG });
  if (!q) line._q.remove();
  dTick(p, line._card.x + line._card.w + 44, y - size * .3, tAns + .4);
  return line;
};

const BEATS = [
  ['intro', 'Ten times as much', titleBeat('Lesson 4.1', 'Ten times as much', 'Do the fact first.')],

  ['story', 'Bookmarks', (m) => {
    const p = panel(0);
    // the problem, on its blue card: "Mia sells ninety bookmarks for nine dollars each." "How much for nine hundred bookmarks?"
    dCard(p, 190, 255, 1220, 300, BLUE_BG, .3);
    dText(p, 'Mia sells 90 bookmarks for $9 each.', 800, 375, .3, { size: 54, fill: INK, weight: 600 });
    dText(p, 'How much for 900 bookmarks?', 800, 480, m('q'), { size: 54, fill: BLUE, weight: 800 });
  }],

  ['ladder', 'Do the fact first', (m) => {
    const p = panel(0);
    dText(p, 'Do the fact first.', 800, 98, .3, { size: 48, fill: INK, weight: 700 });
    // his ladder: the lines on one "=", each as Ava says it; the answer waits behind a "?" until she says it
    const EQ = 790, SZ = 84, t9 = { t: '9', fill: TEAL };
    const l1 = eqLine(p, [t9, ' × ', t9], [{ t: '81', fill: TEAL }], EQ, 255, m('l1'), m('l1', 1.4), { size: SZ });
    const l2 = eqLine(p, [t9, ' × ', t9, { t: '0', fill: ORANGE }], [{ t: '81', fill: TEAL }, { t: '0', fill: ORANGE }],
      EQ, 400, m('l2'), m('l2', 1.55), { size: SZ });
    const l3 = eqLine(p, [t9, ' × ', t9, { t: '00', fill: ORANGE }], [{ t: '8,1', fill: TEAL }, { t: '00', fill: ORANGE }],
      EQ, 545, m('l3'), m('l3', 1.9), { size: SZ });
    // the fact's digits, underlined as each line comes
    [[l1, 'l1'], [l2, 'l2'], [l3, 'l3']].forEach(([l, mark]) => { uline(l.L, 0, 0, m(mark, .4)); uline(l.L, 2, 2, m(mark, .55)); });
    // "Each line gets one more zero." — the zeros each line got
    dText(p, 'Each line gets one more zero.', 800, 700, m('zeros'), { size: 48, fill: INK, weight: 700 });
    [l2.L.row[3], l2.R.row[1]].forEach(e => dNudge(e, m('zeros', 1.2)));
    [l3.L.row[3], l3.R.row[1]].forEach(e => dNudge(e, m('zeros', 1.5)));
  }],

  ['answer', 'Ten times as much', (m) => {
    const p = panel(0);
    // "Nine hundred is ten times ninety." — a "× 10" arrow from 90 to 900
    const SZ = 68, ten = dLine(p, ['900', ' is ', '10', ' times ', '90'], 800, 260, m('ten', .1), { size: SZ });
    later(ten, [1, 2, 3], m('ten', .95));
    later(ten, [4], m('ten', 1.8));
    const a = ten.row[4], b = ten.row[0], top = 260 - SZ * 1.02;
    dJump(p, a._px, top, b._px, top, m('ten', 2.0), { color: INK, lift: 76, dur: .6 });
    dText(p, '× 10', (a._px + b._px) / 2, top - 52, m('ten', 2.2), { size: 40, fill: INK, weight: 800 });
    // "So the money is ten times as much."
    dText(p, 'So the money is 10 times as much.', 800, 410, m('ten', 2.85), { size: 46, fill: INK, weight: 600 });
    // "Nine hundred bookmarks cost eight thousand, one hundred dollars."
    rightAsk(p, ['900 bookmarks → ', '$', { t: '8,1', fill: TEAL }, { t: '00', fill: ORANGE }], 1, 780, 610, m('a'), m('a', 1.95), { size: 72 });
  }],

  ['mistake', 'Watch out', (m) => {
    const p = panel(0);
    dWatchOut(p, .3, 800, 100);
    // the rows line up on the money
    const XD = 900, SZ = 64, row = (items, k) => centreAt(items, SZ, k, XD);
    // "Eight hundred ten dollars is for ninety bookmarks."
    const ok90 = ['90 bookmarks → ', '$810'];
    const r1 = dLine(p, ok90, row(ok90, 1), 300, m('w', -.05), { size: SZ, card: SUN_BG });
    later(r1, [0], m('w', 1.85));
    dTick(p, r1._card.x + r1._card.w + 44, 300 - SZ * .3, m('w', 2.45));
    // "Nine hundred has one more zero." — $810 is not the money for 900 (only $810 is struck)
    const bad = ['90', { t: '0', fill: ORANGE }, ' bookmarks → ', { t: '$810', fill: RED }];
    const r2 = dMistake(p, bad, row(bad, 3), 490, m('not', -.05), null, { size: SZ, strike: [3, 3] });
    dNudge(r2.row[1], m('not', 1.25));
    // "So the answer gets one more zero." — that zero joins 810: $8,100
    const good = ['90', { t: '0', fill: ORANGE }, ' bookmarks → ', '$8,10', { t: '0', fill: ORANGE }];
    const r3 = dLine(p, good, row(good, 3), 680, m('not', 2.6), { size: SZ, card: ORANGE_BG });
    flyPiece(r3, 4, spot(r2, 1), m('not', 2.75), .9);
    dTick(p, r3._card.x + r3._card.w + 44, 680 - SZ * .3, m('not', 3.75));
  }, { minDur: 11.5 }],                                            // the finished Watch out holds 2.5 s

  ['wrap', 'Remember', rememberBeat([['Do the fact first.', 'w1'], ['Each line gets one more zero.', 'w2']])],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
